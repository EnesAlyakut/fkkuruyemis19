version: "3.9"

services:
  # ============================================================
  # MySQL Veritabanı
  # ============================================================
  db:
    image: mysql:8.0
    container_name: fk_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fkrootpassword
      MYSQL_DATABASE: fkkuruyemis
      MYSQL_USER: fkuser
      MYSQL_PASSWORD: fkpassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "fkuser", "-pfkpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Next.js Uygulama
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fk_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # Migration & Seed Servisi (tek seferlik)
  # ============================================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: fk_migrate
    env_file:
      - .env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # ============================================================
  # Nginx Reverse Proxy (Production)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: fk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    profiles:
      - production

volumes:
  mysql_data:
  nginx_logs:
